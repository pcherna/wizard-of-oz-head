<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Great Oz</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
      body.show-cursor { cursor: auto; }
      #stage { display: block; width: 100vw; height: 100vh; }
      #flash { position: fixed; inset: 0; background: #eef4ff; opacity: 0; pointer-events: none; }
      #start {
        position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
        font: 600 28px/1.4 Georgia, serif; color: #6f6; letter-spacing: 0.08em; background: rgba(0, 0, 0, 0.6);
      }
      #start[hidden], #error[hidden], #setup[hidden] { display: none; }
      #error {
        position: fixed; left: 16px; bottom: 16px; max-width: 60ch; padding: 8px 12px;
        font: 14px/1.4 system-ui, sans-serif; color: #fdd; background: #600; border-radius: 6px;
      }
      #setup {
        position: fixed; top: 16px; right: 16px; width: 360px; max-height: calc(100vh - 32px); overflow: auto;
        padding: 12px 16px; font: 13px/1.4 system-ui, sans-serif; color: #cfc; background: rgba(10, 20, 10, 0.92);
        border: 1px solid #3a5; border-radius: 8px; cursor: auto;
      }
      #setup h2 { margin: 0 0 8px; font-size: 15px; }
      #setup small { color: #8a8; font-weight: normal; }
      #setup label { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 6px; margin: 6px 0; }
      #setup select { grid-column: 2 / 4; min-width: 0; }
      #setup output { text-align: right; font-variant-numeric: tabular-nums; }
      #setup h3 { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 4px; font-size: 13px; }
      #setup .test-tone { margin: 2px 0 6px 126px; padding: 4px 10px; }
      #setup .meter { height: 8px; margin: 10px 0; background: #132; border-radius: 4px; overflow: hidden; }
      #setup .meter > div { height: 100%; width: 0; background: #6f6; }
      #setup pre { margin: 8px 0; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
      #setup .credit { color: #8a8; font-size: 11px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="flash"></div>
    <div id="start">Click to summon the Wizard</div>
    <div id="error" hidden></div>
    <script type="module" src="/src/display/main.ts"></script>
  </body>
</html>
